name: 文書の問題・改善
description: 分かりにくい説明、用語、構成、重複などを直します
title: "[docs] "
body:
  - type: input
    id: document
    attributes:
      label: 対象文書
      description: READMEまたはdocs内のpathを書いてください。
      placeholder: docs/jp/コンテキスト削減の基本.md
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: どこが分かりにくいか
      description: 初見で何が伝わらないか、鼻につく表現、説明になっていない箇所などをそのまま書いてください。
      placeholder: 用語を並べているだけで、具体的に何をするのか分からない
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: 問題のある記述
      description: 該当する文章や見出しがあれば貼ってください。

  - type: textarea
    id: target_reader
    attributes:
      label: 読み手
      description: この文書を誰が、どの前提知識なしで理解できるべきかを書いてください。
      placeholder: AIについて詳しくない初見の利用者
    validations:
      required: true

  - type: textarea
    id: rewrite
    attributes:
      label: 書き直し方針
      description: 何を普通の日本語で説明すべきか、構成から直す必要があるかを書いてください。
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      options:
        - P0-A - README・基本説明・手法一覧など入口
        - P0-B - 個別手法・運用文書
        - P0-C - 使い方・ツールガイド
        - P1以降 - 文書以外の作業と並行でよい
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 完了条件
      description: 書き直した後、初見の人が何を理解できれば完了かを書いてください。
      placeholder: |
        - [ ] 冒頭だけで何の話か分かる
        - [ ] 具体的に何をするか説明できる
        - [ ] なぜAIが読む量を減らせるか分かる
        - [ ] 不要な英語・内部用語に依存していない
    validations:
      required: true
