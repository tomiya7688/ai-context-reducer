name: Release v1 distribution

on:
  push:
    branches:
      - main
    paths:
      - 'tools/**'
      - 'release/**'
      - 'README.md'
      - 'LICENSE'
      - '.github/scripts/release-acceptance.sh'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate version without v prefix'
        required: true
        default: '1.0.0'
        type: string
      publish:
        description: 'Publish GitHub Release after every gate passes (requires matching existing tag)'
        required: true
        default: false
        type: boolean
permissions:
  contents: write

jobs:
  source-validation:
    name: Source validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.0"
          fi
          [ -n "$version" ]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Repository consistency
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f LICENSE
          test -f README.md
          test -f release/RELEASE_MANIFEST.json
          bash -n .github/scripts/release-acceptance.sh
      - name: Compile and test all Python tools
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools
          mapfile -t tests < <(find tools -type f -path '*/tests/test_*.py' | sort)
          printf 'Python tests: %s\n' "${#tests[@]}"
          for file in "${tests[@]}"; do
            echo "==> $file"
            python "$file"
          done
      - name: Test every Go module
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t modules < <(find tools -type f -name go.mod -print | sort)
          printf 'Go modules: %s\n' "${#modules[@]}"
          for mod in "${modules[@]}"; do
            dir="$(dirname "$mod")"
            echo "==> $dir"
            (cd "$dir" && go test ./...)
          done

  distribution-e2e:
    name: Distribution E2E / ${{ matrix.name }}
    needs: source-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: linux-x64
            ext: ''
            archive: tar
          - runner: ubuntu-24.04-arm
            name: linux-arm64
            ext: ''
            archive: tar
          - runner: windows-2025
            name: windows-x64
            ext: .exe
            archive: zip
          - runner: windows-11-arm
            name: windows-arm64
            ext: .exe
            archive: zip
          - runner: macos-15-intel
            name: macos-x64
            ext: ''
            archive: tar
          - runner: macos-15
            name: macos-arm64
            ext: ''
            archive: tar
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Resolve release version and bundle path
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.0"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          echo "BUNDLE=$RUNNER_TEMP/ai-context-reducer-v$version-${{ matrix.name }}" >> "$GITHUB_ENV"
      - name: Build exact user distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUNDLE"
          COMMIT="$(git rev-parse HEAD)"

          build_tool() {
            dir="$1"
            name="$2"
            ldflags="$3"
            (
              cd "$dir"
              go build -trimpath -ldflags="$ldflags" -o "$BUNDLE/$name${{ matrix.ext }}" .
            )
          }

          version_flags="-s -w -X main.buildVersion=$RELEASE_VERSION -X main.buildCommit=$COMMIT"
          build_tool tools/common/native/acr-toolbox acr-toolbox "$version_flags"
          build_tool tools/go/small/go-symbols go-symbols "-s -w"
          build_tool tools/go/medium/go-import-map go-import-map "-s -w"
          build_tool tools/go/large/go-package-graph go-package-graph "-s -w"
          build_tool tools/go/medium/affected-tests affected-tests "-s -w"

          cp README.md "$BUNDLE/README.md"
          cp tools/README.md "$BUNDLE/TOOLS_README.md"
          cp LICENSE "$BUNDLE/LICENSE"
          cp release/RELEASE_MANIFEST.json "$BUNDLE/RELEASE_MANIFEST.json"
      - name: Execute full user-distribution acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/release-acceptance.sh "$BUNDLE" "$RELEASE_VERSION" "$RUNNER_TEMP/release-acceptance"
      - name: Package tar distribution
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ai-context-reducer-v$RELEASE_VERSION-${{ matrix.name }}.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$archive" "$(basename "$BUNDLE")"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Package zip distribution
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ai-context-reducer-v$env:RELEASE_VERSION-${{ matrix.name }}.zip"
          Compress-Archive -Path "$env:BUNDLE\*" -DestinationPath $archive -Force
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify packaged archive by extracting it again
        shell: bash
        run: |
          set -euo pipefail
          verify="$RUNNER_TEMP/archive-verify"
          rm -rf "$verify"
          mkdir -p "$verify"
          case "$ARCHIVE" in
            *.zip) unzip -q "$ARCHIVE" -d "$verify"; extracted="$verify" ;;
            *.tar.gz) tar -xzf "$ARCHIVE" -C "$verify"; extracted="$verify/$(basename "$BUNDLE")" ;;
            *) echo "unknown archive: $ARCHIVE" >&2; exit 1 ;;
          esac
          for name in README.md TOOLS_README.md LICENSE RELEASE_MANIFEST.json; do
            test -f "$extracted/$name"
          done
          for name in acr-toolbox go-symbols go-import-map go-package-graph affected-tests; do
            test -f "$extracted/$name${{ matrix.ext }}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-v${{ env.RELEASE_VERSION }}-${{ matrix.name }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 14

  verify-release-set:
    name: Verify complete v1 user distribution
    needs: distribution-e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-v*
          path: release-assets
          merge-multiple: true
      - name: Verify all six archives exist exactly once
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.0"
          fi
          cd release-assets
          expected=(
            "ai-context-reducer-v$version-linux-x64.tar.gz"
            "ai-context-reducer-v$version-linux-arm64.tar.gz"
            "ai-context-reducer-v$version-windows-x64.zip"
            "ai-context-reducer-v$version-windows-arm64.zip"
            "ai-context-reducer-v$version-macos-x64.tar.gz"
            "ai-context-reducer-v$version-macos-arm64.tar.gz"
          )
          actual_count="$(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')"
          [ "$actual_count" -eq 6 ]
          for file in "${expected[@]}"; do
            test -s "$file"
          done
          sha256sum "${expected[@]}" > SHA256SUMS
          test "$(wc -l < SHA256SUMS | tr -d ' ')" -eq 6
      - name: Upload final release candidate set
        uses: actions/upload-artifact@v4
        with:
          name: v1-release-candidate
          path: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs:
      - source-validation
      - distribution-e2e
      - verify-release-set
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v1-release-candidate
          path: release-assets
      - name: Resolve tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v${{ inputs.version }}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          git rev-parse "$tag" >/dev/null 2>&1 || {
            echo "release tag does not exist in checkout: $tag" >&2
            exit 1
          }
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Publish only after every completion gate passed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG"             release-assets/*.zip             release-assets/*.tar.gz             release-assets/SHA256SUMS             --verify-tag             --generate-notes             --title "$RELEASE_TAG"
