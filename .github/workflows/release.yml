name: Release v1 distribution

on:
  push:
    branches:
      - main
    paths:
      - 'tools/**'
      - 'release/**'
      - 'README.md'
      - 'README.en.md'
      - 'docs/**'
      - 'templates/**'
      - 'LICENSE'
      - '.github/workflows/release.yml'
      - '.github/formatters/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Candidate version without v prefix'
        required: true
        default: '1.0.0'
        type: string
      publish:
        description: 'Publish GitHub Release after every gate passes (requires matching existing tag)'
        required: true
        default: false
        type: boolean
      approved_commit:
        description: 'Exact validated commit approved for publication (empty for validation only)'
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - 'tools/**'
      - 'release/**'
      - 'docs/**'
      - 'templates/**'
      - 'README*'
      - '.github/workflows/release.yml'
      - '.github/formatters/**'
permissions:
  contents: write

jobs:
  source-validation:
    name: Source validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Resolve release version
        id: version
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$CANDIDATE_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.0"
          fi
          [ -n "$version" ]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Repository consistency
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -f LICENSE
          test -f README.md
          test -f release/RELEASE_MANIFEST.json
          bash -n release/scripts/acceptance.sh
          bash -n release/scripts/acr_hub_loopback_smoke.sh
      - name: Check changed release files formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r .github/formatters/requirements.txt
          npm ci --prefix .github/formatters --ignore-scripts --no-audit --no-fund
          npm --prefix .github/formatters run format:check -- .github/formatters/format.mjs .github/formatters/package.json .github/formatters/package-lock.json release/scripts/io_coverage.py release/scripts/test_io_coverage.py release/scripts/io_parity.py release/scripts/test_io_parity.py release/IO_PENDING.json .github/workflows/release.yml .github/development/v1-release-gate.md tools/common/small/path-find/README.md
          test -z "$(gofmt -l tools/common/native/acr-toolbox/find_command.go tools/common/native/acr-toolbox/search_command.go tools/common/native/acr-toolbox/search_find_commands_test.go)"
      - name: Validate public entrypoint inventory
        shell: bash
        run: |
          set -euo pipefail
          go test release/scripts/scan_go_entrypoints.go release/scripts/scan_go_entrypoints_test.go
          go build -o "$RUNNER_TEMP/scan-go-entrypoints" release/scripts/scan_go_entrypoints.go
          python release/scripts/test_entrypoint_inventory.py
          python release/scripts/entrypoint_inventory.py --go-scanner "$RUNNER_TEMP/scan-go-entrypoints"
          python release/scripts/test_io_parity.py
          python release/scripts/test_io_coverage.py
          python release/scripts/io_coverage.py --allow-pending
          python release/scripts/io_coverage.py --allow-pending --run --python
      - name: Validate release builder and documentation
        shell: bash
        run: |
          set -euo pipefail
          python release/scripts/test_full_bundle.py
          go build -o "$RUNNER_TEMP/install-guard" release/scripts/install_guard.go
          ACR_TEST_INSTALL_GUARD="$RUNNER_TEMP/install-guard" python release/scripts/test_runtime_guard.py
          python .github/scripts/test_validate_documentation.py
          python .github/scripts/validate_documentation.py .
      - name: Compile and test all Python tools
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools
          python release/scripts/test_python_test_runner.py
          python release/scripts/run_python_tests.py
      - name: Vet and test every Go module
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t modules < <(find tools -type f -name go.mod -print | sort)
          printf 'Go modules: %s\n' "${#modules[@]}"
          for mod in "${modules[@]}"; do
            dir="$(dirname "$mod")"
            echo "==> $dir"
            (cd "$dir" && go vet ./...)
            (cd "$dir" && go test ./...)
            (cd "$dir" && go test -race ./...)
          done

  distribution-e2e:
    name: Distribution E2E / ${{ matrix.name }}
    needs: source-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            name: linux-x64
            ext: ''
            archive: tar
          - runner: ubuntu-24.04-arm
            name: linux-arm64
            ext: ''
            archive: tar
          - runner: windows-2025
            name: windows-x64
            ext: .exe
            archive: zip
          - runner: windows-11-arm
            name: windows-arm64
            ext: .exe
            archive: zip
          - runner: macos-15-intel
            name: macos-x64
            ext: ''
            archive: tar
          - runner: macos-15
            name: macos-arm64
            ext: ''
            archive: tar
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve release version and bundle path
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$CANDIDATE_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.0"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          echo "BUNDLE=$RUNNER_TEMP/ai-context-reducer-v$version-${{ matrix.name }}" >> "$GITHUB_ENV"
          echo "FULL_BUNDLE=$RUNNER_TEMP/ai-context-reducer-full-v$version-${{ matrix.name }}" >> "$GITHUB_ENV"
      - name: Build exact user distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUNDLE"
          COMMIT="$(git rev-parse HEAD)"

          build_tool() {
            dir="$1"
            name="$2"
            ldflags="$3"
            (
              cd "$dir"
              go build -trimpath -ldflags="$ldflags" -o "$BUNDLE/$name${{ matrix.ext }}" .
            )
          }

          version_flags="-s -w -X main.buildVersion=$RELEASE_VERSION -X main.buildCommit=$COMMIT"
          build_tool tools/common/native/acr-toolbox acr-toolbox "$version_flags"
          build_tool tools/go/small/go-symbols go-symbols "-s -w"
          build_tool tools/go/medium/go-import-map go-import-map "-s -w"
          build_tool tools/go/large/go-package-graph go-package-graph "-s -w"
          build_tool tools/go/medium/affected-tests affected-tests "-s -w"

          GUI_HUB_BIN="$RUNNER_TEMP/acr-hub${{ matrix.ext }}"
          INSTALL_GUARD_BIN="$RUNNER_TEMP/install-guard${{ matrix.ext }}"
          go build -trimpath -o "$INSTALL_GUARD_BIN" release/scripts/install_guard.go
          echo "INSTALL_GUARD_BIN=$INSTALL_GUARD_BIN" >> "$GITHUB_ENV"
          (
            cd tools/gui/acr-hub
            go build -trimpath -ldflags="-s -w" -o "$GUI_HUB_BIN" .
          )
          echo "GUI_HUB_BIN=$GUI_HUB_BIN" >> "$GITHUB_ENV"

          cp release/README.cli.md "$BUNDLE/README.md"
          cp release/README.cli.md "$BUNDLE/TOOLS_README.md"
          cp LICENSE "$BUNDLE/LICENSE"
          cp release/RELEASE_MANIFEST.json "$BUNDLE/RELEASE_MANIFEST.json"
          python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["BUNDLE"])/"RELEASE_MANIFEST.json"; d=json.loads(p.read_text()); d["release_version"]=os.environ["RELEASE_VERSION"]; p.write_text(json.dumps(d,indent=2)+"\n")'
          python release/scripts/full_bundle.py build --repo . --normal "$BUNDLE" --gui "$GUI_HUB_BIN" --bundle "$FULL_BUNDLE" --version "$RELEASE_VERSION" --source-commit "$COMMIT"
      - name: Execute full user-distribution acceptance suite
        shell: bash
        run: |
          set -euo pipefail
          python release/scripts/io_coverage.py --allow-pending --run --python --binary "$BUNDLE/acr-toolbox${{ matrix.ext }}"
          python release/scripts/io_coverage.py --allow-pending --run --binary "$FULL_BUNDLE/acr-toolbox${{ matrix.ext }}"
          bash release/scripts/acceptance.sh "$BUNDLE" "$RELEASE_VERSION" "$RUNNER_TEMP/release-acceptance"
          bash release/scripts/acceptance.sh "$FULL_BUNDLE" "$RELEASE_VERSION" "$RUNNER_TEMP/full-release-acceptance"
          python release/scripts/runtime_smoke.py "$BUNDLE" --install-guard "$INSTALL_GUARD_BIN"
          python release/scripts/runtime_smoke.py "$FULL_BUNDLE" --full --install-guard "$INSTALL_GUARD_BIN"
          python release/scripts/full_bundle.py verify --repo . --bundle "$FULL_BUNDLE" --version "$RELEASE_VERSION"
      - name: Verify Windows setup.bat exit propagation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./release/scripts/test_setup_bat.ps1
      - name: Package tar distribution
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ai-context-reducer-v$RELEASE_VERSION-${{ matrix.name }}.tar.gz"
          python release/scripts/archive_tools.py pack "$BUNDLE" "$archive"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          full_archive="$RUNNER_TEMP/ai-context-reducer-full-v$RELEASE_VERSION-${{ matrix.name }}.tar.gz"
          python release/scripts/archive_tools.py pack "$FULL_BUNDLE" "$full_archive"
          echo "FULL_ARCHIVE=$full_archive" >> "$GITHUB_ENV"
      - name: Package zip distribution
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ai-context-reducer-v$env:RELEASE_VERSION-${{ matrix.name }}.zip"
          python release/scripts/archive_tools.py pack $env:BUNDLE $archive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $fullArchive = Join-Path $env:RUNNER_TEMP "ai-context-reducer-full-v$env:RELEASE_VERSION-${{ matrix.name }}.zip"
          python release/scripts/archive_tools.py pack $env:FULL_BUNDLE $fullArchive
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "FULL_ARCHIVE=$fullArchive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify packaged archive by extracting it again
        shell: bash
        run: |
          set -euo pipefail
          verify="$RUNNER_TEMP/archive-verify"
          rm -rf "$verify"
          mkdir -p "$verify"
          python release/scripts/archive_tools.py extract "$ARCHIVE" "$verify"
          extracted="$verify/$(basename "$BUNDLE")"
          root_entries="$(find "$verify" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
          [ "$root_entries" -eq 1 ]
          file_count="$(find "$extracted" -maxdepth 1 -type f | wc -l | tr -d ' ')"
          dir_count="$(find "$extracted" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')"
          [ "$file_count" -eq 9 ]
          [ "$dir_count" -eq 0 ]
          for name in README.md TOOLS_README.md LICENSE RELEASE_MANIFEST.json; do
            test -f "$extracted/$name"
          done
          for name in acr-toolbox go-symbols go-import-map go-package-graph affected-tests; do
            test -f "$extracted/$name${{ matrix.ext }}"
          done
          if [ "${{ runner.os }}" != "Windows" ]; then
            test -x "$extracted/acr-toolbox"
            test -x "$extracted/go-symbols"
            test -x "$extracted/go-import-map"
            test -x "$extracted/go-package-graph"
            test -x "$extracted/affected-tests"
          fi

          python release/scripts/io_coverage.py --allow-pending --run --binary "$extracted/acr-toolbox${{ matrix.ext }}"
          bash release/scripts/acceptance.sh "$extracted" "$RELEASE_VERSION" "$RUNNER_TEMP/release-acceptance-extracted"
          python release/scripts/runtime_smoke.py "$extracted" --install-guard "$INSTALL_GUARD_BIN"
          full_verify="$RUNNER_TEMP/full-archive-verify"
          mkdir -p "$full_verify"
          python release/scripts/archive_tools.py extract "$FULL_ARCHIVE" "$full_verify"
          full_extracted="$full_verify/$(basename "$FULL_BUNDLE")"
          python release/scripts/full_bundle.py verify --repo . --bundle "$full_extracted" --version "$RELEASE_VERSION"
          python release/scripts/io_coverage.py --allow-pending --run --binary "$full_extracted/acr-toolbox${{ matrix.ext }}"
          bash release/scripts/acceptance.sh "$full_extracted" "$RELEASE_VERSION" "$RUNNER_TEMP/full-acceptance-extracted"
          python release/scripts/runtime_smoke.py "$full_extracted" --full --install-guard "$INSTALL_GUARD_BIN"
      - uses: actions/upload-artifact@v4
        with:
          name: release-v${{ env.RELEASE_VERSION }}-${{ matrix.name }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.FULL_ARCHIVE }}
          if-no-files-found: error
          retention-days: 14

  verify-release-set:
    name: Verify complete v1 user distribution
    needs: distribution-e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-v*
          path: release-assets
          merge-multiple: true
      - name: Verify all twelve archives exist exactly once
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$CANDIDATE_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="1.0.0"
          fi
          cd release-assets
          expected=(
            "ai-context-reducer-v$version-linux-x64.tar.gz"
            "ai-context-reducer-v$version-linux-arm64.tar.gz"
            "ai-context-reducer-v$version-windows-x64.zip"
            "ai-context-reducer-v$version-windows-arm64.zip"
            "ai-context-reducer-v$version-macos-x64.tar.gz"
            "ai-context-reducer-v$version-macos-arm64.tar.gz"
          )
          for platform in linux-x64 linux-arm64 windows-x64 windows-arm64 macos-x64 macos-arm64; do
            suffix=tar.gz
            [[ "$platform" != windows-* ]] || suffix=zip
            expected+=("ai-context-reducer-full-v$version-$platform.$suffix")
          done
          actual_count="$(find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')"
          [ "$actual_count" -eq 12 ]
          for file in "${expected[@]}"; do
            test -s "$file"
          done
          sha256sum "${expected[@]}" > SHA256SUMS
          test "$(wc -l < SHA256SUMS | tr -d ' ')" -eq 12
      - name: Upload final release candidate set
        uses: actions/upload-artifact@v4
        with:
          name: v1-release-candidate
          path: |
            release-assets/*.zip
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs:
      - source-validation
      - distribution-e2e
      - verify-release-set
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require complete I/O assignments before publication
        shell: bash
        run: python release/scripts/io_coverage.py
      - uses: actions/download-artifact@v4
        with:
          name: v1-release-candidate
          path: release-assets
      - name: Resolve tag
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="v$CANDIDATE_VERSION"
          else
            tag="$GITHUB_REF_NAME"
          fi
          git rev-parse "$tag" >/dev/null 2>&1 || {
            echo "release tag does not exist in checkout: $tag" >&2
            exit 1
          }
          tag_commit="$(git rev-list -n 1 "$tag")"
          validated_commit="$(git rev-parse HEAD)"
          [ "$APPROVED_COMMIT" = "$validated_commit" ] || {
            echo 'Publishing requires explicit approval of this exact commit.' >&2
            exit 1
          }
          [ "$tag_commit" = "$validated_commit" ] || {
            echo "tag $tag points to $tag_commit but validated commit is $validated_commit" >&2
            exit 1
          }
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Publish only after every completion gate passed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG"             release-assets/*.zip             release-assets/*.tar.gz             release-assets/SHA256SUMS             --verify-tag             --generate-notes             --title "$RELEASE_TAG"
