name: Release portable tools

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Test native toolbox
        working-directory: tools/common/native/acr-toolbox
        run: go test ./...
      - name: Test standalone Go tools
        shell: bash
        run: |
          set -euo pipefail
          for dir in             tools/go/small/go-symbols             tools/go/medium/go-import-map             tools/go/large/go-package-graph             tools/go/medium/affected-tests
          do
            (cd "$dir" && go test ./...)
          done

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            name: windows-x64
            ext: .exe
            archive: zip
          - goos: windows
            goarch: arm64
            name: windows-arm64
            ext: .exe
            archive: zip
          - goos: linux
            goarch: amd64
            name: linux-x64
            ext: ''
            archive: tar
          - goos: linux
            goarch: arm64
            name: linux-arm64
            ext: ''
            archive: tar
          - goos: darwin
            goarch: amd64
            name: macos-x64
            ext: ''
            archive: tar
          - goos: darwin
            goarch: arm64
            name: macos-arm64
            ext: ''
            archive: tar
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Build portable bundle
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          EXT: ${{ matrix.ext }}
          NAME: ${{ matrix.name }}
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ''

        shell: bash
        run: |
          set -euo pipefail
          out="dist/ai-context-reducer-${TAG}-${NAME}"
          mkdir -p "$out"

          build_tool() {
            dir="$1"
            name="$2"
            ldflags="$3"
            (
              cd "$dir"
              go build -trimpath -ldflags="$ldflags" -o "../../../../$out/$name$EXT" .
            )
          }

          COMMIT="$(git rev-parse HEAD)"
          version_flags="-s -w -X main.buildVersion=${TAG#v} -X main.buildCommit=${COMMIT}"
          build_tool tools/common/native/acr-toolbox acr-toolbox "$version_flags"
          build_tool tools/go/small/go-symbols go-symbols "-s -w"
          build_tool tools/go/medium/go-import-map go-import-map "-s -w"
          build_tool tools/go/large/go-package-graph go-package-graph "-s -w"
          build_tool tools/go/medium/affected-tests affected-tests "-s -w"

          cp LICENSE "$out/LICENSE"
          cp tools/README.md "$out/TOOLS_README.md"

          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && zip -qr "ai-context-reducer-${TAG}-${NAME}.zip" "ai-context-reducer-${TAG}-${NAME}")
          else
            tar -C dist -czf "dist/ai-context-reducer-${TAG}-${NAME}.tar.gz" "ai-context-reducer-${TAG}-${NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.zip *.tar.gz > SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG"             release-assets/*.zip             release-assets/*.tar.gz             release-assets/SHA256SUMS             --verify-tag             --generate-notes             --title "$TAG"
