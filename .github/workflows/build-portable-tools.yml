name: Build portable tools

on:
  push:
    paths:
      - 'tools/common/native/acr-toolbox/**'
      - 'tools/go/**'
      - '.github/workflows/build-portable-tools.yml'
  pull_request:
    paths:
      - 'tools/common/native/acr-toolbox/**'
      - 'tools/go/**'
      - '.github/workflows/build-portable-tools.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        module:
          - tools/common/native/acr-toolbox
          - tools/go/small/go-symbols
          - tools/go/medium/go-import-map
          - tools/go/large/go-package-graph
          - tools/go/medium/affected-tests
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            name: windows-x64
            ext: .exe
          - goos: windows
            goarch: arm64
            name: windows-arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            name: linux-x64
            ext: ''
          - goos: linux
            goarch: arm64
            name: linux-arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            name: macos-x64
            ext: ''
          - goos: darwin
            goarch: arm64
            name: macos-arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Build portable bundle
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          EXT: ${{ matrix.ext }}
          OUT: artifacts/${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"

          build_tool() {
            dir="$1"
            name="$2"
            (
              cd "$dir"
              go build -trimpath -ldflags='-s -w' -o "../../../../$OUT/$name$EXT" .
            )
          }

          build_tool tools/common/native/acr-toolbox acr-toolbox
          build_tool tools/go/small/go-symbols go-symbols
          build_tool tools/go/medium/go-import-map go-import-map
          build_tool tools/go/large/go-package-graph go-package-graph
          build_tool tools/go/medium/affected-tests affected-tests
      - uses: actions/upload-artifact@v4
        with:
          name: portable-tools-${{ matrix.name }}
          path: artifacts/${{ matrix.name }}/
