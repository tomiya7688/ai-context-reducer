name: Build portable tools

on:
  push:
    paths:
      - 'tools/common/native/acr-toolbox/**'
      - '.github/workflows/build-portable-tools.yml'
  pull_request:
    paths:
      - 'tools/common/native/acr-toolbox/**'
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Test
        working-directory: tools/common/native/acr-toolbox
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            name: windows-x64
            ext: .exe
          - goos: windows
            goarch: arm64
            name: windows-arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            name: linux-x64
            ext: ''
          - goos: linux
            goarch: arm64
            name: linux-arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            name: macos-x64
            ext: ''
          - goos: darwin
            goarch: arm64
            name: macos-arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Build
        working-directory: tools/common/native/acr-toolbox
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../../../../artifacts/${{ matrix.name }}
          go build -trimpath -ldflags='-s -w' -o ../../../../artifacts/${{ matrix.name }}/acr-toolbox${{ matrix.ext }} .
      - uses: actions/upload-artifact@v4
        with:
          name: acr-toolbox-${{ matrix.name }}
          path: artifacts/${{ matrix.name }}/acr-toolbox${{ matrix.ext }}
