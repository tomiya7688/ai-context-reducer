name: Build portable tools

on:
  push:
    paths:
      - 'tools/common/native/acr-toolbox/**'
      - 'tools/go/**'
      - '.github/workflows/build-portable-tools.yml'
  pull_request:
    paths:
      - 'tools/common/native/acr-toolbox/**'
      - 'tools/go/**'
      - '.github/workflows/build-portable-tools.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        module:
          - tools/common/native/acr-toolbox
          - tools/go/small/go-symbols
          - tools/go/medium/go-import-map
          - tools/go/large/go-package-graph
          - tools/go/medium/affected-tests
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  smoke:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: ./artifacts/acr-toolbox
          - os: windows-latest
            binary: .\\artifacts\\acr-toolbox.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Build host toolbox
        working-directory: tools/common/native/acr-toolbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../../../artifacts
          ext=""
          case "${{ runner.os }}" in
            Windows) ext=".exe" ;;
          esac
          go build -trimpath -o "../../../../artifacts/acr-toolbox${ext}" .
      - name: Smoke common commands
        shell: bash
        run: |
          set -euo pipefail
          BIN="${{ matrix.binary }}"
          "$BIN" env
          "$BIN" analyze .
          "$BIN" select .
          "$BIN" stats .
          "$BIN" doc-index .
          "$BIN" context-budget --mode fast --top 5 .
          "$BIN" hotspot-report --limit 5 .
          "$BIN" compact-diff --base HEAD --head HEAD
          "$BIN" language-env
          "$BIN" language-setup .
          "$BIN" language-run --out "$RUNNER_TEMP/acr-language" .
          "$BIN" language-medium-run --out "$RUNNER_TEMP/acr-language-medium" .
          "$BIN" language-large-plan .
          "$BIN" scoped-guides tools/common/native/acr-toolbox/main.go .
          cat > "$RUNNER_TEMP/policy-rules.json" <<'EOF'
          {"rules":[{"id":"SMOKE001","paths":["README.md"],"severity":"error","forbid":"__acr_policy_smoke_forbidden__"}]}
          EOF
          "$BIN" policy-check --rules "$RUNNER_TEMP/policy-rules.json" .
          mkdir -p "$RUNNER_TEMP/acr-template-smoke"
          printf 'Hello {{name}}\n' > "$RUNNER_TEMP/acr-template-smoke/template.txt"
          printf '{"name":"World"}\n' > "$RUNNER_TEMP/acr-template-smoke/vars.json"
          "$BIN" template --template "$RUNNER_TEMP/acr-template-smoke/template.txt" --vars "$RUNNER_TEMP/acr-template-smoke/vars.json" --out "$RUNNER_TEMP/acr-template-smoke/out.txt" --required name --template-id smoke --template-version 1
          "$BIN" template --template "$RUNNER_TEMP/acr-template-smoke/template.txt" --vars "$RUNNER_TEMP/acr-template-smoke/vars.json" --out "$RUNNER_TEMP/acr-template-smoke/out.txt" --required name --check
      - name: Smoke text pipeline
        shell: bash
        run: |
          set -euo pipefail
          BIN="${{ matrix.binary }}"
          "$BIN" search --max-results 5 --glob README.md context .
          "$BIN" find --type file --max-results 5 '*.md' .
          "$BIN" slice context README.md
          printf 'ok\nwarning: sample\nerror: sample\n' | "$BIN" compact-log

  build:
    needs:
      - test
      - smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            name: windows-x64
            ext: .exe
          - goos: windows
            goarch: arm64
            name: windows-arm64
            ext: .exe
          - goos: linux
            goarch: amd64
            name: linux-x64
            ext: ''
          - goos: linux
            goarch: arm64
            name: linux-arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            name: macos-x64
            ext: ''
          - goos: darwin
            goarch: arm64
            name: macos-arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Build portable bundle
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          EXT: ${{ matrix.ext }}
          OUT: artifacts/${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"

          build_tool() {
            dir="$1"
            name="$2"
            (
              cd "$dir"
              go build -trimpath -ldflags='-s -w' -o "../../../../$OUT/$name$EXT" .
            )
          }

          build_tool tools/common/native/acr-toolbox acr-toolbox
          build_tool tools/go/small/go-symbols go-symbols
          build_tool tools/go/medium/go-import-map go-import-map
          build_tool tools/go/large/go-package-graph go-package-graph
          build_tool tools/go/medium/affected-tests affected-tests
      - uses: actions/upload-artifact@v4
        with:
          name: portable-tools-${{ matrix.name }}
          path: artifacts/${{ matrix.name }}/
